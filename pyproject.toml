[project]
name = "rag-workshop"
version = "0.1.0"
description = "Badminton Rules Bot: a RAG chat over the BWF rule books, built lab by lab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "httpx",
    "mistralai",
    "pydantic-settings",
    "pymupdf>=2.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
